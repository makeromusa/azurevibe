name: AzureVibe CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend REST API Automated Tests
        run: npm test

      - name: Verify Static Assets Integrity
        run: |
          test -f index.html
          test -f css/styles.css
          test -f js/app.js
          test -f js/data/az900-data.js
